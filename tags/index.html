        function getTagDisplayName(tag) {
            return tagDisplayNames[tag] || tag.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function countPostsByTag() {
            const counts = {};
            posts.forEach(post => {
                post.tags.forEach(tag => {
                    counts[tag] = (counts[tag] || 0) + 1;
                });
            });
            return counts;
        }

        function getPostsByTag(tag) {
            return posts.filter(post => post.tags.includes(tag));
        }

        function renderTagsCloud() {
            const counts = countPostsByTag();
            const cloud = document.getElementById('tags-cloud');
            
            const sortedTags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
            
            let html = '';
            sortedTags.forEach(tag => {
                const count = counts[tag];
                let sizeClass = 'tag-small';
                if (count >= 5) sizeClass = 'tag-large';
                else if (count >= 3) sizeClass = 'tag-medium';
                
                html += `<a href="#${tag}" class="tag ${sizeClass}">${getTagDisplayName(tag)} (${count})</a>`;
            });
            
            cloud.innerHTML = html;
        }

        function renderTagSections() {
            const container = document.getElementById('tag-sections');
            const counts = countPostsByTag();
            const sortedTags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
            
            let html = '';
            sortedTags.forEach(tag => {
                const tagPosts = getPostsByTag(tag);
                html += `
                    <div class="tag-section" id="${tag}">
                        <h3>${getTagDisplayName(tag)}</h3>
                        <ul class="post-list">
                            ${tagPosts.map(post => `
                                <li class="post-item">
                                    <a href="${post.file}">${post.title}</a>
                                    <span class="post-date">${post.date}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        renderTagsCloud();
        renderTagSections();

        if (window.location.hash) {
            const element = document.querySelector(window.location.hash);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
