    <style>

            background: #3498db;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9em;
        }
        .tag:hover { background: #2980b9; }
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        footer a { color: #3498db; }
        @media (max-width: 600px) {
            .container { padding: 10px; }
            header h1 { font-size: 1.5rem; }
            nav a { display: block; margin: 5px 0; }
