            }
        ];

        const POSTS_PER_PAGE = 10;

        function getPageNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            return parseInt(urlParams.get('page')) || 1;
        }

        function renderPosts(page) {
            const container = document.getElementById('posts-container');
            const start = (page - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const pagePosts = posts.slice(start, end);

            let html = '<ul class="post-list">';
            pagePosts.forEach(post => {
                const tagsHtml = post.tags.map(tag => 
                    `<a href="../tags/index.html#${tag}" class="tag">${tag.replace(/-/g, ' ')}</a>`
                ).join(' ');
                
                html += `
                    <li class="post-item">
                        <a href="${post.file}">${post.title}</a>
                        <span class="post-date">${post.date}</span>
                        <div class="post-tags" style="margin-top: 10px;">
                            ${tagsHtml}
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function renderPagination(currentPage) {
            const totalPages = Math.ceil(posts.length / POSTS_PER_PAGE);
            const pagination = document.getElementById('pagination');
            
            let html = '';
            
            // Previous button
            if (currentPage > 1) {
                html += `<a href="?page=${currentPage - 1}">← Previous</a>`;
            } else {
                html += `<span class="disabled">← Previous</span>`;
            }
            
            // Page info
            html += `<span class="current-page">Page ${currentPage} of ${totalPages}</span>`;
            
            // Next button
            if (currentPage < totalPages) {
                html += `<a href="?page=${currentPage + 1}">Next →</a>`;
            } else {
                html += `<span class="disabled">Next →</span>`;
            }
            
            pagination.innerHTML = html;
        }

        // Initialize
        const currentPage = getPageNumber();
        renderPosts(currentPage);
        renderPagination(currentPage);
    </script>
